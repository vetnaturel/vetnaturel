name: Automatic Pinterest Publisher

on:
  schedule:
    # S'exécute chaque jour à 8h00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Permet de lancer l'action manuellement depuis GitHub

jobs:
  publish-pins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v3

      - name: Configuration de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Exécution du script Pinterest
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: python publish_pinterest.py
